[project]
name = "neobim-ifc-service"
version = "1.0.0"
description = "IfcOpenShell-based IFC generation microservice for NeoBIM Workflow Builder"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "ifcopenshell>=0.8.0",
    "ifctester>=0.8.0",
    "boto3>=1.35.0",
    "structlog>=24.0",
    # Phase 1 — needed by BuildingModel invariants ROOM_BOUNDED + FOOTPRINT_VALID
    # for shapely.geometry.Polygon validity / signed-area checks.
    "shapely>=2.0",
    # Phase 2A Slice 2A.3 — text extraction from text-based PDF briefs.
    # Image-based PDFs (avg < 100 chars/page) defer to the Vision-capable
    # Anthropic call wired in Slice 2A.4.
    "pypdf>=4.0",
    # Phase 2A Slice 2A.4 — Anthropic SDK for the design-agent LLM
    # stages (BriefAnalyst, ProgramArchitect, vision-fallback PDF
    # extraction). >=0.40 lands tool_use + ephemeral prompt caching
    # support that the cache layer relies on.
    "anthropic>=0.40",
    # Canvas Unification (2026-05-17) — needed by app/routers/v3_previews.py
    # to render top + isometric PNG previews of generated IFCs (canvas
    # EX-007 stage). matplotlib brings numpy as a transitive dep; we
    # don't pin numpy explicitly so ifcopenshell's compatible-numpy
    # resolution stays the source of truth.
    "matplotlib>=3.7",
    # KOS Week 5C-1 — DXF customer-drawing parser. ezdxf does the vector
    # parsing; Pillow is available for raster post-processing of debug PNGs.
    # shapely + matplotlib (above) are reused for geometry + the debug overlay.
    "ezdxf>=1.3",
    "Pillow>=10.0",
    # KOS Week 5C-2 — PDF customer-drawing parser. PyMuPDF (fitz) does the
    # vector path + text extraction and the debug-overlay rasterization.
    # Pinned to the version validated against the customer PDFs in 5C-2.
    "pymupdf==1.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Phase 2A Slice 2A.3 — pure-Python PDF authoring used by
    # tests/test_design_pdf_extractor.py to generate disposable test
    # PDFs at test time. Not needed in production — the service only
    # reads PDFs, never writes them.
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Phase 0 — explicit package discovery. The new ids/ directory (XML
# files, not Python) sits next to app/, which trips setuptools' flat-
# layout multi-top-level-package safety check and aborts the editable
# install before pydantic / etc. ever resolve. Pin app/ as the only
# importable package and explicitly exclude the rest as belt-and-
# suspenders.
include = ["app*"]
exclude = ["ids*", "scripts*", "tests*", "docs*"]
